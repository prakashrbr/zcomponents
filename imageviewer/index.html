<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imaging: key-image viewer prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDF0F3; --paper:#FFFFFF; --paper-2:#F6F8FA; --ink:#15202B; --ink-2:#4A5563; --ink-3:#687280;
  --rule:#D7DDE3; --rule-2:#BDC6CF; --accent:#1F4E8C; --accent-tint:#E3ECF7;
  --markA:#0B6470; --markA-tint:#DDF3F6; --markB:#5B4B8A; --markB-tint:#ECE8F7;
  --grow:#9A4A12; --grow-tint:#FBEADB; --ai:#8A2F92; --ai-tint:#F7E6F8; --warn:#8A5300; --warn-tint:#FBEBCD;
  --well:#06080A; --well-ink:#C9D1D9;
  --sans:"Public Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1419; --paper:#171E26; --paper-2:#1D252E; --ink:#E5EAF0; --ink-2:#A8B3BF; --ink-3:#8A95A1;
  --rule:#2B3540; --rule-2:#3D4955; --accent:#8DB6EE; --accent-tint:#1C2F47;
  --markA:#7FD6E0; --markA-tint:#123A40; --markB:#BBAEF0; --markB-tint:#2A2447;
  --grow:#F2B07A; --grow-tint:#3A2616; --ai:#E6A2EC; --ai-tint:#3A1F3D; --warn:#F2C06B; --warn-tint:#3A2C12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --canvas:#0F1419; --paper:#171E26; --paper-2:#1D252E; --ink:#E5EAF0; --ink-2:#A8B3BF; --ink-3:#8A95A1;
  --rule:#2B3540; --rule-2:#3D4955; --accent:#8DB6EE; --accent-tint:#1C2F47;
  --markA:#7FD6E0; --markA-tint:#123A40; --markB:#BBAEF0; --markB-tint:#2A2447;
  --grow:#F2B07A; --grow-tint:#3A2616; --ai:#E6A2EC; --ai-tint:#3A1F3D; --warn:#F2C06B; --warn-tint:#3A2C12; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chart{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.chart b{color:var(--ink);font-weight:600;font-size:15px;margin-right:8px}
.wrap{max-width:1240px;margin:0 auto;padding:12px 20px 40px}
.im{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.im-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px 10px;flex-wrap:wrap}
.im-head h1{font-size:21px;line-height:1.25;font-weight:600;margin:0;letter-spacing:-0.005em}
.im-head .sub{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13.5px;color:var(--ink-2);min-height:34px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--accent-tint);color:var(--accent);font-weight:600}
.refnote{margin:0 20px 12px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.refnote::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule-2);flex:none}
.im-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-top:1px solid var(--rule)}
@media (max-width:920px){.im-body{grid-template-columns:minmax(0,1fr)}}
.viewer{padding:14px 20px 16px;border-right:1px solid var(--rule);min-width:0}
@media (max-width:920px){.viewer{border-right:0;border-bottom:1px solid var(--rule)}}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.tool-lbl{font-size:12.5px;color:var(--ink-3);margin-right:6px}
.tog{border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13.5px;min-height:38px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);font-weight:600}
.tog .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.tog.ai .dot{border-style:dashed;border-radius:2px}
.tog.chg .dot{border-style:dotted}
.ask{border:1px solid var(--rule-2);background:var(--paper-2);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.ask p{margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:7px 14px;font-size:14px;min-height:38px}
.btn:hover{background:var(--paper-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.btn.pri:hover{opacity:.92;background:var(--accent)}
.btn.q{border-color:transparent;background:transparent;color:var(--accent)}
.stages{display:grid;gap:10px}
.stages.two{grid-template-columns:1fr 1fr}
.stage{position:relative;aspect-ratio:1/1;background:var(--well);border-radius:10px;overflow:hidden;width:100%;max-width:620px;touch-action:none}
.stages.two .stage{max-width:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.corner{position:absolute;top:8px;font-size:12px;color:var(--well-ink);background:rgba(6,8,10,.72);padding:3px 8px;border-radius:5px;pointer-events:none}
.corner.l{left:8px}.corner.r{right:8px}
.orient{position:absolute;bottom:8px;font-size:11px;color:#8C96A0;pointer-events:none}
.orient.l{left:10px}.orient.r{right:10px}
.mk{position:absolute;transform:translate(0,-50%);border:0;border-radius:5px;padding:3px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.3;min-height:26px}
.mk.A{background:#35C8D8;color:#04262B}
.mk.B{background:#B7A8F2;color:#1D1540}
.mk.ai{background:transparent;color:#F2B4F6;border:1.5px dashed #E58BEF}
.mk.ghost{background:rgba(6,8,10,.8);color:#F5B27A;border:1px dotted #F5B27A;font-weight:500;pointer-events:none}
.mk.hot{outline:2px solid #FFFFFF;outline-offset:1px}
.ring{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.ring.A{stroke:#35C8D8}.ring.B{stroke:#B7A8F2}
.ring.ghost{stroke:#F5B27A;stroke-dasharray:2 3}
.ring.ai{stroke:#E58BEF;stroke-dasharray:5 4}
.ring.hot{stroke-width:3}
.pulse{fill:none;stroke:#FFFFFF;stroke-width:1.5;vector-effect:non-scaling-stroke;animation:pulse 900ms ease-out 1 forwards}
@keyframes pulse{from{opacity:.9}to{opacity:0}}
.handle{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #FFFFFF;pointer-events:none}
.grip{position:absolute;top:86%;left:-15px;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#FFFFFF;color:#06080A;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;pointer-events:auto;cursor:ew-resize;border:0}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9AA4AE;font-size:14px}
.bar{width:40%;height:4px;background:#1E252C;border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:35%;background:#5E6B77;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.swipectl{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:13px;color:var(--ink-2);max-width:620px}
.swipectl input{flex:1;accent-color:var(--accent)}
.cap{margin:8px 0 10px;font-size:14px;color:var(--ink-2);max-width:620px}
.cap b{color:var(--ink);font-weight:600}
.ainote{max-width:620px;border:1px solid var(--rule);border-left:3px solid var(--ai);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13.5px;margin:0 0 10px;color:var(--ink-2)}
.aionly{max-width:620px;border:1px solid var(--ai);background:var(--ai-tint);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.aionly p{margin:0 0 8px}
.strip{display:flex;gap:8px;flex-wrap:wrap;max-width:620px}
.th{position:relative;width:84px;border:1px solid var(--rule-2);border-radius:8px;padding:4px;background:var(--paper);text-align:left}
.th[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th canvas,.th .ph{display:block;width:100%;aspect-ratio:1/1;border-radius:5px;background:var(--well)}
.th .ph{display:flex;align-items:center;justify-content:center;color:#6C7782;font-size:11px}
.th .n{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.th .fl{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.th .fl i{font-style:normal;font-size:10.5px;font-weight:700;border-radius:3px;padding:0 4px;line-height:1.5}
.fl .A{background:#35C8D8;color:#04262B}.fl .B{background:#B7A8F2;color:#1D1540}
.loadnote{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.empty{max-width:620px;aspect-ratio:4/3;border:1px dashed var(--rule-2);border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:10px;background:var(--paper-2)}
.empty h3{margin:0;font-size:17px;font-weight:600}
.empty p{margin:0;color:var(--ink-2)}
.report{padding:16px 20px 18px;min-width:0}
.report h2{font-size:15px;font-weight:600;margin:0 0 8px}
.finds{list-style:none;margin:0 0 14px;padding:0}
.finds li{margin:0 0 6px}
.fbtn{display:grid;grid-template-columns:auto 1fr;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;font-family:var(--serif);font-size:16.5px;line-height:1.55}
.fbtn:hover,.fbtn.hot{background:var(--paper-2);border-color:var(--rule)}
.fbtn.sel{border-color:var(--rule-2);background:var(--paper-2)}
.fplain{font-family:var(--serif);font-size:16.5px;line-height:1.55;padding:4px 10px 4px 44px;color:var(--ink)}
.chip{font-family:var(--sans);font-size:12.5px;font-weight:700;border-radius:5px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.chip.A{background:var(--markA-tint);color:var(--markA);border:1.5px solid var(--markA)}
.chip.B{background:var(--markB-tint);color:var(--markB);border:1.5px solid var(--markB)}
.rec{display:block;font-family:var(--sans);font-size:13.5px;color:var(--ink);margin-top:4px;padding-left:10px;border-left:3px solid var(--grow);border-radius:0}
.meta{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:2px}
.hist{border:1px solid var(--rule);border-radius:10px;padding:10px 12px 8px;margin:0 0 14px}
.hist h3{font-size:14px;font-weight:600;margin:0}
.hist p{margin:0;font-size:13px;color:var(--ink-2)}
.hist svg{display:block;width:100%;max-width:360px;height:auto;margin-top:4px}
.hist .ln{fill:none;stroke:var(--markA);stroke-width:2}
.hist .pt{fill:var(--paper);stroke:var(--markA);stroke-width:2}
.hist .pt.cur{fill:var(--markA)}
.hist text{font-family:var(--sans);font-size:11px;fill:var(--ink-2)}
.hist text.v{fill:var(--ink);font-weight:600;font-size:12px}
.hist .thr{stroke:var(--rule-2);stroke-dasharray:3 3}
details{border-top:1px solid var(--rule);padding:8px 0}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
details p{margin:6px 0;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.signed{font-size:13px;color:var(--ink-3);margin:10px 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.err{border:1px solid var(--warn);background:var(--warn-tint);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.err p{margin:0 0 8px}
.term{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.def{font-family:var(--sans);font-size:14px;background:var(--accent-tint);border-radius:8px;padding:8px 10px;margin:6px 0}
.def b{font-weight:600}
.qs{margin:4px 0 14px;padding-left:20px;font-size:14.5px}
.qs li{margin:4px 0}
.pintro{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.tl{border-top:1px solid var(--rule);padding:12px 20px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tl h2{font-size:14px;font-weight:600;margin:0}
.tl ol{list-style:none;display:flex;gap:0;margin:0;padding:0;flex-wrap:wrap;align-items:center}
.tl li{display:flex;align-items:center}
.tl li+li::before{content:"";width:28px;height:2px;background:var(--rule-2);margin:0 4px}
.st{border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:6px 12px;text-align:left;min-height:44px}
.st[aria-current="true"]{border-color:var(--accent);background:var(--accent-tint)}
.st .d{display:block;font-size:13.5px;font-weight:600}
.st .s{display:block;font-size:12px;color:var(--ink-2)}
.st[aria-current="true"] .d{color:var(--accent)}
.proto{max-width:1240px;margin:0 auto;padding:0 20px 40px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13px;color:var(--ink-2)}
.proto select{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);min-height:36px}
kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
.toast{position:fixed;left:50%;bottom:0;transform:translateX(-50%);margin-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(560px,92vw);box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s ease-out}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="chart"><div><b>Rosa Delgado</b>64 years, MRN 4471209</div><div>Sample patient and images, generated for this prototype</div></div>
<main class="wrap">
  <section class="im" aria-labelledby="title">
    <div class="im-head">
      <div>
        <h1 id="title">CT chest without contrast</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="seg" role="radiogroup" aria-label="Show this for">
        <button role="radio" data-k="m-clin" data-mode="clin">Care team</button>
        <button role="radio" data-k="m-pat" data-mode="pat">Patient</button>
      </div>
    </div>
    <p class="refnote" id="refnote"></p>
    <div class="im-body">
      <div class="viewer" id="viewer"></div>
      <div class="report" id="report" aria-live="off"></div>
    </div>
    <div class="tl" id="timeline"></div>
  </section>
</main>
<div class="proto">
  <label>Preview state <select id="pstate" data-k="pstate">
    <option value="normal">Normal</option>
    <option value="loading">Key images still loading</option>
    <option value="reportonly">No key images marked</option>
    <option value="viewerdown">Hospital viewer not responding</option>
  </select></label>
  <span>Shortcuts: <kbd>←</kbd> <kbd>→</kbd> key images, <kbd>C</kbd> compare, <kbd>G</kbd> show change</span>
  <button class="btn q" id="reset">Reset prototype</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){

  ];
  var ZOOM = {sx:42,sy:76,s:64};
  var GLOSS = {

    }
    if(S.err && clin){
      h+='<div class="err" role="alert"><p><b>The hospital viewer didn\u2019t respond.</b> The report and key images here are still up to date.</p><div class="row"><button class="btn" data-act="open" data-k="retry">Try again</button><button class="btn" data-act="copy" data-k="copy2">Copy study link</button></div></div>';
    }
    r.innerHTML=h;
  }
  function renderHead(){
    var st=STUDIES[S.study];
    $('#sub').textContent = st.date+(S.study===LATEST?', latest':'')+'. Final report by '+st.reader+', radiology.';
    $('#refnote').textContent = S.mode==='clin' ? 'Reference view for the care team. Diagnostic reading happens in the hospital viewer.' : 'This is how the patient sees this result in their portal.';
    $$('[data-mode]').forEach(function(b){b.setAttribute('aria-checked',S.mode===b.dataset.mode?'true':'false');b.tabIndex=S.mode===b.dataset.mode?0:-1;});
    var tl=$('#timeline'), h='<h2>'+(S.mode==='clin'?'Chest CTs':'Your chest scans')+'</h2><ol>';
    STUDIES.forEach(function(s,i){h+='<li><button class="st" data-k="st-'+i+'" data-study="'+i+'" aria-current="'+(S.study===i)+'"><span class="d">'+s.date+'</span><span class="s">'+(S.mode==='clin'?'Finding A '+s.A+' mm':'Spot '+s.A+' mm')+(i===LATEST?', latest':'')+'</span></button></li>';});
    tl.innerHTML=h+'</ol>';
  }
  function render(opts){
    var ak=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    renderHead(); renderViewer(); renderReport(); writeHash();
    if(ak){ var el=document.querySelector('[data-k="'+ak+'"]'); if(el && (!opts || !opts.noFocus)) el.focus({preventScroll:true}); }
  }

  /* ---------- loading simulation ---------- */
  var loadTimers=[];
  function startLoad(){
    loadTimers.forEach(clearTimeout); loadTimers=[]; S.ready={};
    var order=[S.img].concat([0,1,2,3].filter(function(i){return i!==S.img;}));
    order.forEach(function(i,n){
      if(S.pstate==='loading' && n>=2) return;
      loadTimers.push(setTimeout(function(){ S.ready[i]=true; render({noFocus:true}); if(Object.keys(S.ready).length===4) say('All key images loaded'); }, reduce?60:260+n*330));
    });
  }

  /* ---------- actions ---------- */
  function selectFinding(f,fromMark){
    S.sel=f;
    var imgs=visibleKeys().filter(function(i){return KEYS[i].f.indexOf(f)>-1;});
    if(imgs.length && KEYS[S.img].f.indexOf(f)<0) S.img=imgs[0];
    render();
    var st=STUDIES[S.study];
    say('Finding '+f+', '+FIND[f].name+', '+st[f]+' millimetres, shown on key image '+keyNum(S.img));
    if(fromMark){ var b=document.querySelector('[data-find="'+f+'"]'); if(b){ b.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); b.focus({preventScroll:true}); } }
  }
  function openViewer(){
    if(S.pstate==='viewerdown'){ S.err=true; render(); say('The hospital viewer did not respond'); return; }
    S.err=false; render();
    toast('Opening '+STUDIES[S.study].date+' CT in the hospital viewer at key image '+keyNum(S.img)+(S.sel?' with finding '+S.sel+' selected':'')+'.');
  }
  function copyLink(){
    var url=location.href.split('#')[0]+'#'+hashStr();
    var msg='Link copied. It opens this study at key image '+keyNum(S.img)+(S.sel?' with finding '+S.sel+' selected':'')+'.';
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){toast(msg);},function(){toast('Copy this link: '+url);}); } else toast('Copy this link: '+url); }catch(e){ toast('Copy this link: '+url); }
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.dataset.mode){ if(S.mode!==t.dataset.mode){ S.mode=t.dataset.mode; S.def=null; S.aiAsk=false; S.aiOnly=false; if(S.mode==='pat'){S.compare='off';S.win='lung';if(visibleKeys().indexOf(S.img)<0)S.img=0;} render(); say(S.mode==='pat'?'Showing the patient view':'Showing the care team view'); } return; }
    if(t.dataset.win){ S.win=t.dataset.win; render(); say(WIN[S.win].label+' contrast'); return; }
    if(t.dataset.cmp){ if(S.study===0 && t.dataset.cmp!=='off'){ toast('This is the earliest study, so there\u2019s nothing to compare it with.'); return; } S.compare=t.dataset.cmp; if(S.compare!=='off' && S.img===0) S.img=1; render(); say(S.compare==='off'?'Comparison off':(S.compare==='swipe'?'Swipe comparison with '+STUDIES[S.study-1].date:'Side by side with '+STUDIES[S.study-1].date)); return; }
    if(t.dataset.img!=null && t.classList.contains('th')){ S.img=+t.dataset.img; render(); return; }
    if(t.dataset.find){ if(S.sel===t.dataset.find){ S.sel=null; render(); return; } selectFinding(t.dataset.find,false); return; }
    if(t.dataset.mark){ selectFinding(t.dataset.mark,true); return; }
    if(t.dataset.aionly){ S.aiOnly=true; render(); var p=$('.aionly'); if(p) p.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); return; }
    if(t.dataset.study!=null){ var n=+t.dataset.study; if(n!==S.study){ S.study=n; S.aiOnly=false; if(n===0) S.compare='off'; startLoad(); render(); say('Showing '+STUDIES[n].date); } return; }
    if(t.dataset.term){ S.def=t.dataset.term; render(); return; }
    var a=t.dataset.act;
    if(a==='ghost'){ if(S.study===0){ toast('Show change needs an earlier study to compare with.'); return; } S.ghost=!S.ghost; if(S.ghost && !KEYS[S.img].zoom) S.img=1; render(); say(S.ghost?'Showing the magnified view. The dotted ring is the size of finding A on '+STUDIES[S.study-1].date:'Change hidden'); }
    else if(a==='ai'){ if(S.ai){ S.ai=false; S.aiOnly=false; S.aiAsk=false; render(); } else { S.aiAsk=true; render(); var y=$('[data-k="aiyes"]'); if(y) y.focus(); } }
    else if(a==='aiyes'){ S.ai=true; S.aiAsk=false; render(); say('AI marks shown. One AI mark is not described in the report, on key image 4.'); }
    else if(a==='aino'){ S.aiAsk=false; render(); }
    else if(a==='aidismiss'){ S.aiOnly=false; render(); }
    else if(a==='openai'){ if(S.pstate==='viewerdown'){ S.err=true; render(); return; } toast('Opening the latest CT in the hospital viewer at the AI-marked spot on key image 4.'); }
    else if(a==='askrad'){ toast('A message to radiology is ready to send, with this study and the AI-marked spot attached.'); }
    else if(a==='open'){ openViewer(); }
    else if(a==='copy'){ copyLink(); }
    else if(a==='defclose'){ S.def=null; render(); }
    else if(a==='askteam'){ toast('A new message to your care team is open, with this scan attached.'); }
  });
  document.addEventListener('pointerover',function(e){
    var f=e.target.closest && e.target.closest('[data-find],[data-mark]'); if(!f) return;
    var id=f.dataset.find||f.dataset.mark;
    $$('.mk[data-mark="'+id+'"]').forEach(function(m){m.classList.add('hot');});
    $$('.ring.'+id).forEach(function(m){m.classList.add('hot');});
    $$('[data-find="'+id+'"]').forEach(function(m){m.classList.add('hot');});
  });
  document.addEventListener('pointerout',function(e){
    var f=e.target.closest && e.target.closest('[data-find],[data-mark]'); if(!f) return;
    var id=f.dataset.find||f.dataset.mark; if(S.sel===id) return;
    $$('.mk[data-mark="'+id+'"], .ring.'+id+', [data-find="'+id+'"]').forEach(function(m){m.classList.remove('hot');});
  });
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.target.closest && e.target.closest('[role="radiogroup"]') && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); var nm=S.mode==='clin'?'pat':'clin'; $('[data-mode="'+nm+'"]').click(); $('[data-mode="'+nm+'"]').focus(); return; }
    if(tag==='input'||tag==='select'||tag==='textarea'||e.metaKey||e.ctrlKey||e.altKey) return;
    var keys=visibleKeys(), pos=keys.indexOf(S.img);
    if(e.key==='ArrowRight'){ S.img=keys[(pos+1)%keys.length]; render(); say('Key image '+keyNum(S.img)+', '+KEYS[S.img].label); }
    else if(e.key==='ArrowLeft'){ S.img=keys[(pos-1+keys.length)%keys.length]; render(); say('Key image '+keyNum(S.img)+', '+KEYS[S.img].label); }
    else if((e.key==='c'||e.key==='C') && S.mode==='clin' && S.pstate!=='reportonly'){ if(S.study===0){ toast('This is the earliest study, so there\u2019s nothing to compare it with.'); return; } var order=['off','swipe','side']; S.compare=order[(order.indexOf(S.compare)+1)%3]; if(S.compare!=='off' && S.img===0) S.img=1; render(); say('Compare: '+S.compare); }
    else if((e.key==='g'||e.key==='G') && S.mode==='clin' && S.pstate!=='reportonly'){ $('[data-act="ghost"]') && $('[data-act="ghost"]').click(); }
  });

  function bindSwipe(){
    var r=$('#swipe'); if(r) r.addEventListener('input',function(){ S.swipe=+r.value; applySwipe(); });
    var grip=$('#grip'), stage=grip?grip.closest('.stage'):null; if(!grip) return;
    grip.addEventListener('pointerdown',function(e){ e.preventDefault(); grip.setPointerCapture(e.pointerId);
      function mv(ev){ var rc=stage.getBoundingClientRect(); S.swipe=Math.max(0,Math.min(100,Math.round((ev.clientX-rc.left)/rc.width*100))); applySwipe(); }
      function up(){ grip.removeEventListener('pointermove',mv); grip.removeEventListener('pointerup',up); grip.removeEventListener('pointercancel',up); }
      grip.addEventListener('pointermove',mv); grip.addEventListener('pointerup',up); grip.addEventListener('pointercancel',up);
    });
  }
  function applySwipe(){ var top=$('#swipeTop'), h=$('#handle'), r=$('#swipe'); if(top) top.style.clipPath='inset(0 '+(100-S.swipe)+'% 0 0)'; if(h) h.style.left=S.swipe+'%'; if(r && +r.value!==S.swipe) r.value=S.swipe; writeHash(); }

  /* ---------- deep links ---------- */
  function hashStr(){ return 's='+STUDIES[S.study].id+'&i='+(S.img+1)+(S.sel?'&f='+S.sel:'')+'&m='+S.mode+'&w='+S.win+(S.compare!=='off'?'&c='+S.compare:''); }
  function writeHash(){ try{ history.replaceState(null,'','#'+hashStr()); }catch(e){} }
  function readHash(){
    var h=(location.hash||'').replace(/^#/,''); if(!h) return;
    h.split('&').forEach(function(p){ var kv=p.split('='), k=kv[0], v=decodeURIComponent(kv[1]||'');
      if(k==='s'){ STUDIES.forEach(function(s,i){ if(s.id===v) S.study=i; }); }
      if(k==='i'){ var n=parseInt(v,10)-1; if(n>=0&&n<KEYS.length) S.img=n; }
      if(k==='f' && FIND[v]) S.sel=v;
      if(k==='m' && (v==='clin'||v==='pat')) S.mode=v;
      if(k==='w' && WIN[v]) S.win=v;
      if(k==='c' && (v==='swipe'||v==='side')) S.compare=v;
    });
    if(S.study===0) S.compare='off';
    if(S.mode==='pat'){ S.compare='off'; if(visibleKeys().indexOf(S.img)<0) S.img=0; }
  }

  $('#pstate').addEventListener('change',function(){ S.pstate=this.value; S.err=false; startLoad(); render({noFocus:true}); say('Preview state: '+this.options[this.selectedIndex].text); });
  $('#reset').addEventListener('click',function(){ S={study:LATEST,img:0,win:'lung',compare:'off',swipe:50,ghost:false,ai:false,aiAsk:false,aiOnly:false,mode:'clin',sel:null,def:null,pstate:'normal',ready:{},err:false}; $('#pstate').value='normal'; startLoad(); render({noFocus:true}); window.scrollTo(0,0); toast('Prototype reset.'); });

  readHash();
  startLoad();
  render({noFocus:true});
})();
</script>
</body>
</html>
